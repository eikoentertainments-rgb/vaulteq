<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il mio libro</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>📖 Il mio libro sugli obiettivi</h1>
  <nav>
    <a href="{{ url_for('chat') }}">Scrivi</a>
    <a href="{{ url_for('libro') }}" class="active">Leggi il libro</a>
  </nav>
</header>

<main class="libro">
  {% for cid, cap in capitoli.items() %}
  <section class="capitolo">
    <h2>{{ cap.titolo }}</h2>
    <p class="guida">{{ cap.guida }}</p>
    <p class="riepilogo">{{ cap.riepilogo }}</p>
    {% for data, testo in cap.voci %}
      <article class="voce-libro">
        <div class="voce-data">{{ data }}</div>
        <p>{{ testo }}</p>
      </article>
    {% endfor %}
  </section>
  {% endfor %}
</main>
</body>
</html>
